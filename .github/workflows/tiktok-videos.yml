name: TikTok videos (weekly)

# 宣伝用ショート動画（縦1080x1920・30fps・15〜30秒）を、毎週7本つくる。
# 投稿はしない：動画・表紙・投稿文（posts.md / *.txt）を Artifact として置くだけ。
# どこかの手順が失敗したら、そこで止まる（後の手順は実行しない）。
# ゲーム本体はビルドして画面を撮るだけで、変更しない（docs/ には何も書かない）。
on:
  # 検証用（確認できたら外す）：このブランチへの push で、翌週分を1回作る
  push:
    branches: [claude/tiktok-videos]
    paths: ['.github/workflows/tiktok-videos.yml']
  schedule:
    # 毎週 日曜 21:43（日本時間）＝ 日曜 12:43 UTC。翌週（月〜日）の分を作る
    - cron: '43 12 * * 0'
  workflow_dispatch:
    inputs:
      week:
        description: '作る週（例：2026-W45）。空なら、翌週'
        required: false
        default: ''
      only:
        description: '作る動画の番号（例：1,3）。空なら7本すべて'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: tiktok-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            video/package-lock.json

      - name: 日本語フォント・ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji ffmpeg
          fc-cache -f

      - name: 週を決める
        id: week
        env:
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$INPUT_WEEK" ]; then
            WEEK="$INPUT_WEEK"
          else
            # 翌週（日本時間で7日後）の ISO 週
            WEEK=$(TZ=Asia/Tokyo date -d '+7 days' +%G-W%V)
          fi
          [[ "$WEEK" =~ ^[0-9]{4}-W[0-9]{2}$ ]] || { echo "週の形式が違う: $WEEK"; exit 1; }
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "週: $WEEK"

      # ゲームをビルドして、撮影用のテストページを作る（ゲームの tools/test と同じ手順）
      - name: ゲームをビルド
        run: |
          npm ci
          node build.mjs
          node tools/test/make-test-page.mjs

      - name: 動画の依存を入れる
        working-directory: video
        run: npm ci

      - name: ゲーム画面を撮る
        working-directory: video
        run: npm run capture

      - name: データ抽出・音の合成・テスト
        working-directory: video
        run: |
          npm run prepare-assets
          npm run typecheck
          npm test

      - name: 7本をレンダリング（失敗したら止まる）
        working-directory: video
        env:
          WEEK: ${{ steps.week.outputs.week }}
          ONLY: ${{ inputs.only }}
        run: |
          ARGS=(--week "$WEEK" --out "out/$WEEK")
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          npm run render:week -- "${ARGS[@]}"

      - name: 投稿文を、実行結果のページに表示
        run: cat "video/out/${{ steps.week.outputs.week }}/posts.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-${{ steps.week.outputs.week }}
          path: video/out/${{ steps.week.outputs.week }}
          retention-days: 30
          if-no-files-found: error
